name: Refresh licences and activity

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch licences and activity (GitHub and Hugging Face public data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_openness.py --force
      - name: Rebuild the site
        run: python3 tools/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly refresh: licences and activity"
            git push
          fi
